[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northwind-retail-analytics"
version = "1.0.0"
description = "Production-style retail ETL and analytics platform for Northwind Outfitters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathon Watterson" }]
dependencies = []

[project.scripts]
retail-etl = "retail_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

